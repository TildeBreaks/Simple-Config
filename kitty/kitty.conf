# Font configuration
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Window layout
remember_window_size  yes
initial_window_width  640
initial_window_height 400

# Bell
enable_audio_bell no

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled

# Includes
include ./colors.conf
